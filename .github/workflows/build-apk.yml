name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17（Android SDK 工具要求）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK（并跳过 JDK 版本检查，以防万一）
        uses: android-actions/setup-android@v4
        env:
          SKIP_JDK_VERSION_CHECK: true   # 忽略 sdkmanager 的 JDK 检查，确保运行

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK（输出详细信息）
        run: ./gradlew assembleDebug --info

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
